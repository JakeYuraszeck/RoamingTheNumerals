<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build math background data</title>
<!-- Renders the LaTeX in equations.js with MathJax and saves the result as math-equations.js in the site folder.
     The site's math-background.js then scatters those equations down the page.
     To rebuild: from the project folder run  node tools/math-background/server.js
     then open http://localhost:8765/tools/math-background/build.html in a browser. -->
<script>
  window.MathJax = { svg: { fontCache: 'none' }, startup: { typeset: false } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="equations.js"></script>
<style>
  body { font: 14px system-ui, sans-serif; margin: 20px; }
  #measure { position: absolute; left: -10000px; top: 0; font-size: 20px; }
  #log { white-space: pre-wrap; }
</style>
</head>
<body>
<p id="log">Waiting for MathJax...</p>
<div id="measure"></div>
<script>
  const log = msg => { document.getElementById('log').textContent += '\n' + msg; };

  // Render one equation at 20px and keep its drawing, its viewBox and its size in pixels.
  function renderOne(tex) {
    const node = MathJax.tex2svg(tex, { display: false });
    const svg = node.querySelector('svg');
    const holder = document.getElementById('measure');
    holder.innerHTML = '';
    holder.appendChild(node);
    const box = svg.getBoundingClientRect();
    const err = svg.querySelector('[data-mjx-error]');
    if (err) throw new Error('LaTeX error in "' + tex + '": ' + err.getAttribute('data-mjx-error'));
    const [vx, vy, vw, vh] = svg.getAttribute('viewBox').split(/\s+/).map(Number);
    // Trim MathJax bookkeeping attributes to keep the file small.
    const inner = svg.innerHTML.replace(/ data-mml-node="[^"]*"/g, '').replace(/ data-c="[^"]*"/g, '');
    return { w: +box.width.toFixed(1), h: +box.height.toFixed(1), vx, vy, vw, vh, d: inner };
  }

  MathJax.startup.promise.then(async () => {
    log('MathJax ready.');
    const levels = {};
    let count = 0;
    for (const level of Object.keys(window.EQUATIONS)) {
      levels[level] = window.EQUATIONS[level].map(renderOne);
      count += levels[level].length;
    }
    const js = '// Generated by tools/math-background/build.html from tools/math-background/equations.js. Do not edit by hand.\n' +
      'window.MATH_BG = ' + JSON.stringify({ base: 20, levels }) + ';\n';
    const res = await fetch('/save-file?name=math-equations.js', { method: 'POST', body: js });
    const msg = count + ' equations rendered, ' + Math.round(js.length / 1024) + ' KB: ' + (await res.text());
    log(msg);
    window.BUILD_DONE = msg;
  }).catch(e => { log('FAILED: ' + e.message); window.BUILD_DONE = 'FAILED: ' + e.message; });
</script>
</body>
</html>
